worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    
    # Rate limiting to prevent abuse
    limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

    # --- HTTP (Port 80) Redirects to HTTPS ---
    # This server block catches all HTTP traffic and redirects it to the secure HTTPS version.
    server {
        listen 80;
        listen [::]:80;
        server_name a2zutilityhub.com www.a2zutilityhub.com admin.a2zutilityhub.com blogs.a2zutilityhub.com db.a2zutilityhub.com;

        # For Certbot verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS (Port 443) Server Blocks ---

    # Main application server block (a2zutilityhub.com and www)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name a2zutilityhub.com www.a2zutilityhub.com;

        ssl_certificate /etc/letsencrypt/live/a2zutilityhub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/a2zutilityhub.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://web; # Proxy to the 'web' service in docker-compose
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            try_files $uri $uri/ /index.html;
        }
    }

    # Admin subdomain
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.a2zutilityhub.com;
        
        ssl_certificate /etc/letsencrypt/live/a2zutilityhub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/a2zutilityhub.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://web; # Also proxies to the main web app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            try_files $uri $uri/ /index.html;
        }
    }

    # Blog subdomain
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name blogs.a2zutilityhub.com;
        
        ssl_certificate /etc/letsencrypt/live/a2zutilityhub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/a2zutilityhub.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://web; # Also proxies to the main web app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            try_files $uri $uri/ /index.html;
        }
    }

    # Database admin subdomain with security
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name db.a2zutilityhub.com;
        
        ssl_certificate /etc/letsencrypt/live/a2zutilityhub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/a2zutilityhub.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # --- IP Whitelisting ---
        # Uncomment and add your IP addresses to restrict access.
        # This is a critical security measure.
        # allow 1.2.3.4;  # Your office IP
        # allow 5.6.7.8;  # Your home IP
        # deny all;       # Deny all other IPs

        location / {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://db_admin; # Proxy to the Adminer container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}